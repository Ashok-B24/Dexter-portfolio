<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raghu — Fullstack Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">Loading...</div>
    <script>
      window.addEventListener('error', function(e) {
        var d = document.createElement('pre');
        d.textContent = 'Error: ' + (e.message || e.error || JSON.stringify(e));
        d.style.cssText = 'position:fixed;bottom:0;left:0;z-index:99999;background:#000;color:lime;padding:16px;font:14px monospace;max-width:100vw;pointer-events:none';
        document.body.appendChild(d);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.createElement('pre');
        d.textContent = 'Unhandled: ' + (e.reason || e);
        d.style.cssText = 'position:fixed;bottom:60px;left:0;z-index:99999;background:#000;color:red;padding:16px;font:14px monospace;max-width:100vw;pointer-events:none';
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
